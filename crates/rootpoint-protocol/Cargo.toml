[package]
name = "rootpoint-protocol"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rootpoint-math = { path = "../rootpoint-math" }
rootpoint-model = { path = "../rootpoint-model" }
rootpoint-render = { path = "../rootpoint-render" }
# A pack is a zip file. zip names flate2 with its default features off, so flate2 is named here for
# its `rust_backend`, miniz_oxide, pure Rust and built for the browser, rather than zip's default
# `deflate`, which adds zopfli and zlib-rs.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# The user id names the fallback runtime directory, `/tmp/rootpoint-<uid>/`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "rootpoint-headless"
path = "src/bin/rootpoint-headless.rs"

[[bin]]
name = "rootpoint-ctl"
path = "src/bin/rootpoint-ctl.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
proptest = "1"
